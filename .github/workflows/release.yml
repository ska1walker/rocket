name: release

# Baut die beiden Abbilder und legt sie öffentlich unter
# ghcr.io/<owner>/rocket-<dienst>:<version> ab, damit die Olares-Box sie
# ohne Zugangsdaten zieht. Dazu das gepackte Chart als Artefakt — das ist
# die Datei, die in den Markt geht.
#
# Drei Auslöser:
#
# - **Merge nach main mit neuer Version** (der Normalfall seit 26.9.1).
#   Steht in olares/Chart.yaml eine Version, zu der es noch keinen Tag
#   gibt, wird gebaut und danach Tag `v<version>` samt Release angelegt —
#   erst nach erfolgreichem Bau, damit ein gescheiterter Bau keinen Tag
#   hinterlässt. Gibt es den Tag schon, passiert nichts: Ein Merge ohne
#   Versionssprung ist kein Release. Der Tag entsteht mit GITHUB_TOKEN
#   und löst diesen Workflow deshalb nicht ein zweites Mal aus.
#   Anlass: Die Claude-Sitzungen dürfen nur ihren Arbeitsbranch pushen,
#   keine Tags — mergen dürfen sie. So braucht ein Release keinen
#   Handgriff mehr (docs/BETRIEB.md, „Veröffentlichen").
# - **Tag von Hand** (`git push origin vYY.M.n`) — wie bisher.
# - **workflow_dispatch** mit einer Version — baut, ohne Tag.

on:
  push:
    branches: [main]
    # Auch der Workflow selbst: Wer ihn ändert, soll sehen, dass er läuft
    # — und eine noch nicht getaggte Version wird dabei veröffentlicht.
    paths: [olares/Chart.yaml, .github/workflows/release.yml]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag without leading v (e.g. 26.9.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  version:
    name: which version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      proceed: ${{ steps.v.outputs.proceed }}
      create_tag: ${{ steps.v.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # die Tags gehören zur Entscheidung

      - id: v
        run: |
          CHART_VERSION="$(grep -E '^version:' olares/Chart.yaml | head -1 | awk '{print $2}')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"; PROCEED=true; CREATE=false
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"; PROCEED=true; CREATE=false
          else
            V="$CHART_VERSION"; CREATE=false
            if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
              PROCEED=false
              echo "### v$V ist schon getaggt — kein Release" >> "$GITHUB_STEP_SUMMARY"
            else
              PROCEED=true; CREATE=true
              echo "### Neue Version $V — bauen, dann v$V taggen" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "create_tag=$CREATE" >> "$GITHUB_OUTPUT"

  preflight:
    name: olares chart · sanity
    needs: version
    if: needs.version.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      build_images: ${{ steps.decide.outputs.build_images }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: install helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: codified Olares lessons (scripts/check-chart.sh)
        run: bash scripts/check-chart.sh

      - name: chart version must match the version to release
        if: github.event_name == 'push'
        run: |
          CHART_VERSION="$(grep -E '^version:' olares/Chart.yaml | head -1 | awk '{print $2}')"
          if [ "$VERSION" != "$CHART_VERSION" ]; then
            echo "::error::version $VERSION does not match olares/Chart.yaml version $CHART_VERSION"
            exit 1
          fi
          echo "version $VERSION matches the chart"

      # Ein leerer Tag in values.yaml heißt „folgt Chart.AppVersion" — der
      # Normalfall, das Chart referenziert dann genau diesen Tag. Ein
      # gesetzter Tag ist ein Pin auf eine Vorversion: Die Abbilder gibt es
      # schon, nichts bauen.
      - name: are images needed for this version?
        id: decide
        run: |
          BUILD=true
          PINS="$(grep -E "^[[:space:]]+tag:" olares/values.yaml | grep -vE 'tag:[[:space:]]*(""|'"''"')[[:space:]]*$' || true)"
          if [ -n "$PINS" ] \
             && ! grep -qE "^[[:space:]]+tag:[[:space:]]*[\"']?${VERSION}[\"']?[[:space:]]*$" olares/values.yaml; then
            BUILD=false
          fi
          echo "build_images=$BUILD" >> "$GITHUB_OUTPUT"
          if [ "$BUILD" = "true" ]; then
            echo "### Images werden gebaut (\`$VERSION\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Image-Build übersprungen — values.yaml pinnt eine Vorversion" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: package chart
        run: |
          mkdir -p dist
          helm package olares -d dist
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz
          if-no-files-found: error

  build:
    name: ${{ matrix.service }}
    needs: [version, preflight]
    if: needs.preflight.outputs.build_images == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nur amd64 — das Manifest verspricht auch nur das. Ein Next.js-Bau
      # unter QEMU für arm64 dauert eine halbe Stunde, und keine Box, die
      # dieses CRM bekommt, ist eine ARM-Maschine.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/rocket-${{ matrix.service }}:${{ needs.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.owner }}/rocket-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Erst wenn beide Abbilder draußen sind: Tag und Release, mit dem Chart
  # als Anhang — dieselbe Datei, die in den Markt geht.
  tag:
    name: tag and release
    needs: [version, build]
    if: needs.version.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist

      - name: create tag and release
        run: |
          gh release create "v$VERSION" dist/rocket-"$VERSION".tgz \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --notes "Rocket $VERSION — Abbilder ghcr.io/${{ github.repository_owner }}/rocket-{frontend,backend}:$VERSION, Chart im Anhang. Automatisch nach dem Merge angelegt."
          echo "### Tag und Release v$VERSION angelegt" >> "$GITHUB_STEP_SUMMARY"
