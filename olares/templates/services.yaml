# ============================================================================
# Nur ClusterIP. Kein NodePort, kein LoadBalancer, kein hostNetwork —
# Olares lässt nichts anderes zu, und von außen führt der Weg
# ausschließlich über den deklarierten Entrance.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rocket
  namespace: {{ .Release.Namespace }}
  labels:
    app: rocket
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: rocket
    component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rocket-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: rocket
    component: backend
spec:
  type: ClusterIP
  selector:
    app: rocket
    component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rocket-links
  namespace: {{ .Release.Namespace }}
  labels:
    app: rocket
    component: links
spec:
  type: ClusterIP
  selector:
    app: rocket
    component: links
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
