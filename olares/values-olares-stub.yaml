# Nur zum Prüfen mit `helm lint` und `helm template`. Die echten Werte
# injiziert Olares zur Laufzeit; dieses Blatt tut nur so, als wären sie da.
postgres:
  host: postgres-cluster.os-platform
  port: "5432"
  username: rocket
  password: nur-zum-pruefen
  databases:
    rocket: rocket-db
bfl:
  username: pruefer
user:
  zone: pruefer.olares.com
userspace:
  appData: /olares/userdata/Cache/pruefer/rocket
  appCache: /olares/userdata/Cache/pruefer/rocket-cache
  appCommon: /olares/rootfs/Common
cluster:
  arch: amd64
